controller_server:
  ros__parameters:
    # Frames
    global_frame: odom
    robot_base_frame: base_link
    controller_plugins: ["FollowPath"]
    
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # 基本运动参数
      max_vel_x: 0.2
      min_vel_x: 0.0
      max_vel_theta: 0.5
      min_vel_theta: -0.5
      acc_lim_x: 0.5
      acc_lim_theta: 1.0
      
      # 避障关键参数
      occdist_scale: 0.2
      stop_time_buffer: 0.3
      oscillation_reset_dist: 0.05
      
      # 评估器配置
      critics: ["GoalAlign", "PathAlign", "PathDist", "GoalDist", "ObstacleFootprint"]
      GoalAlign:
        scale: 5.0
      PathAlign:
        scale: 5.0
      PathDist:
        scale: 5.0
      GoalDist:
        scale: 5.0
      ObstacleFootprint:
        scale: 15.0  # 提高障碍物权重
        cost_scaling_factor: 1.0
        inflation_cost_scaling_factor: 3.0
      
      # 采样参数
      vx_samples: 15
      vy_samples: 0
      vtheta_samples: 15
      sim_time: 1.7
      
# 本地代价地图配置
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      width: 3
      height: 3
      resolution: 0.05
      plugins: ["range_sensor_layer", "inflation_layer"]

      range_sensor_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: True
        topics: ["/ros_robot_controller/ultrasonic"]
        no_readings_timeout: 2.0
        clear_on_max_reading: False
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.1
        cost_scaling_factor: 2.0

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link

      plugins: ["range_sensor_layer", "inflation_layer"]

      range_sensor_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: True
        topics: ["/ros_robot_controller/ultrasonic"]
        no_readings_timeout: 2.0
        clear_on_max_reading: False

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.1
        cost_scaling_factor: 2.0

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true  # 关键：允许在未知区域规划
      planner_window_x: 10.0
      planner_window_y: 10.0
    # Frames
    global_frame: odom
    robot_base_frame: base_link

behavior_server:
  ros__parameters:
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
      spin_xy_goal_tolerance: 0.25
      spin_yaw_goal_tolerance: 0.25
    backup:
      plugin: "nav2_behaviors/BackUp"
      backup_dist: -0.15
      backup_speed: 0.025
    wait:
      plugin: "nav2_behaviors/Wait"

bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    default_server_timeout: 20
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5